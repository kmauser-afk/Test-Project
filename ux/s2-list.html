<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HighWise · Student List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone-shell">
    <div class="phone">
      <div class="phone-top">
        <img class="lockup" src="logo.svg" alt="HighWise" />
        <span class="chip">Maya</span>
      </div>
      <div class="phone-body">
        <h1 class="rise">Your list</h1>
        <p class="lede rise rise-2">Suggested and Mine.</p>

        <p style="font-weight:700;margin:0 0 0.55rem">Suggested</p>
        <article class="school-card rise rise-2">
          <strong>UW–Madison</strong>
          <div class="muted" style="margin-bottom:0.55rem">Madison, WI</div>
          <span class="chip fit">Fit</span>
          <div style="margin-top:0.75rem">
            <button class="btn-gold" type="button">Add to my list</button>
          </div>
        </article>
        <article class="school-card rise rise-3">
          <strong>University of Michigan</strong>
          <div class="muted" style="margin-bottom:0.55rem">Ann Arbor, MI</div>
          <span class="chip reach">Reach</span>
        </article>

        <p style="font-weight:700;margin:1.1rem 0 0.55rem">Mine</p>
        <article class="school-card rise rise-3">
          <strong>Northwestern University</strong>
          <div class="muted" style="margin-bottom:0.55rem">Evanston, IL · ED</div>
          <span class="chip reach">Reach</span>
        </article>
      </div>
      <nav class="bottom-nav">
        <a href="s1-home.html">Home</a>
        <a class="active" href="s2-list.html">List</a>
        <a href="#">Tasks</a>
        <a href="#">Files</a>
      </nav>
    </div>
  </div>
</body>
</html>
